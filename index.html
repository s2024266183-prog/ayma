<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grid Template Areas with Containers</title>
<style>
.container {
display: grid;
grid-template-areas:
"header header header"
"sidebar section1 section1"
"sidebar section2 section3"
"footer footer footer";

grid-template-columns: 200px 1fr 1fr;
grid-gap: 20px;
width: 85%;
margin: 50px auto;
}
.header {
grid-area: header;
background: #5cff8d;
padding: 25px;
color: rgb(255, 255, 255);
text-align: center;
}

.sidebar {
grid-area: sidebar;
background: #2fd09a65;
padding: 25px;
min-height: 350px;
color: #000000;
text-align: center;
}

.section1 {
grid-area: section1;
background: #ff4343;
padding: 25px;
text-align: center;
}

.section2 {
grid-area: section2;
background: #d2ff55;
padding: 25px;
text-align: center;
}

.section3 {
grid-area: section3;
background: #ffb17d;
padding: 25px;
text-align: center;
}

.footer {
grid-area: footer;
background: #9b79ff77;
padding: 25px;
text-align: center;
color: rgb(255, 255, 255);
}

</style>
</head>
<body>

<div class="container">

<div class="header">Header</div>

<div class="sidebar">Sidebar</div>

<div class="section1">section-1</div>

<div class="section2">section-2</div>

<div class="section3">section-3</div>

<div class="footer">Footer</div>

</div>

</body>
</html>
